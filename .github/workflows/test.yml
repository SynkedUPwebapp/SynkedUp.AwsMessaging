name: UnitTest

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/**
      - README.md
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    name: 'Run Unit Tests'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        working-directory: SynkedUp.AwsMessaging.UnitTests
        run: dotnet test
