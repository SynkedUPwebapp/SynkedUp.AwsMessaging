name: Publish to NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    name: 'Publish to NuGet'
    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC token exchange)
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Unit Tests
        working-directory: SynkedUp.AwsMessaging.UnitTests
        run: dotnet test
      
      - name: Pack
        working-directory: SynkedUp.AwsMessaging
        run: 'dotnet pack -o . -p:PackageVersion=2.0.${{ github.run_number }}'
        
      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish
        working-directory: SynkedUp.AwsMessaging
        run: 'dotnet nuget push "*.nupkg" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json'
